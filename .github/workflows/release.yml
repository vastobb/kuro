name: Kuro Release (signed)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android platform + build-tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Check signing secrets
        run: |
          MISSING=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "missing repository secret: $v"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "Create them with: keytool -genkeypair, base64, gh secret set (see README)."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/kuro-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          KURO_KEYSTORE_FILE: /tmp/kuro-release.jks
          KURO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KURO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KURO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Run unit tests (JVM, no device)
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Verify signature and identity
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | head -n 5
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "$APK" > badging.txt
          grep "package:" badging.txt
          grep -q "package: name='dev.kuro.app'" badging.txt
          grep -q "application-label:'Kuro'" badging.txt
          grep "launchable-activity" badging.txt
          cp "$APK" kuro-release.apk
          ls -lh kuro-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: kuro-release.apk
          path: kuro-release.apk
          if-no-files-found: error
