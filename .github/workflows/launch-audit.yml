name: Launch audit (emulator logcat)

# Release smoke test: boot emulator, launch the signed release APK,
# capture any launch crash. Uses the release APK, not debug.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android platform + build-tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Check signing secrets
        run: |
          MISSING=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "missing repository secret: $v"; MISSING=1; fi
          done
          [ "$MISSING" = "0" ] || exit 1
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/kuro-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          KURO_KEYSTORE_FILE: /tmp/kuro-release.jks
          KURO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KURO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KURO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Launch release on emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            ls -lh app/build/outputs/apk/release/
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -n dev.kuro.app/dev.kuro.app.MainActivity
            sleep 20
            adb shell pidof dev.kuro.app && echo "PROCESS ALIVE" || echo "PROCESS GONE"
            adb shell dumpsys activity activities | grep -i -A 3 "kuro" | head -n 20 || true
            adb logcat -d -v brief > logcat.txt || true
            echo "=== AndroidRuntime / FATAL ==="
            grep -B 2 -A 40 "FATAL EXCEPTION" logcat.txt | head -n 120 || echo "no FATAL EXCEPTION"
            echo "=== kuro lines ==="
            grep -i "kuro" logcat.txt | head -n 40 || echo "no kuro lines"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-logcat
          path: logcat.txt
          if-no-files-found: warn
