name: Kuro Screenshots (Paparazzi)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android platform
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Record screenshots
        run: ./gradlew :app:recordPaparazziDebug --stacktrace

      - name: Dump test XML on failure
        if: failure()
        run: |
          ls app/build/test-results/testDebugUnitTest/ || true
          grep -A 12 "<failure" app/build/test-results/testDebugUnitTest/TEST-dev.kuro.app.screens.KuroScreenshotTest.xml | head -n 60 || true

      - name: List screenshots
        run: find app/src/test/snapshots -type f | sort

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: kuro-screenshots
          path: app/src/test/snapshots
          if-no-files-found: error
