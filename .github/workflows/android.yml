name: Kuro UI Build (cloud, no local build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android platform + build-tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests (JVM, no device)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: List APK outputs
        if: always()
        run: |
          find . -type f -name "*.apk" | head -n 20
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kuro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Verify Kuro identity in APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          AAPT=$ANDROID_HOME/build-tools/34.0.0/aapt2
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK=$APK"
          $AAPT dump badging "$APK" > badging.txt
          head -n 30 badging.txt
          grep "application:" badging.txt
          grep "launchable-activity" badging.txt
          grep -q "application-label:'Kuro'" badging.txt
